      (2) управление порядком групп на доске стрелками вверх/вниз. Настройки per-board.
      Набор групп не меняется — GroupId union и GROUP_IDS сохраняются. Убрать ненужную
      группу можно скрытием (уже есть, 0006), ширину full/half настроить тоже
      можно (уже есть, 0007). Побочный эффект: computeGroupClasses в BoardLayout.svelte
