      completed) отражает личный workflow автора плагина и не подходит другим ролям.
      Примеры: руководитель без делегирования и оргнамерений хочет убрать эти группы;
      рядовому инженеру достаточно трёх — backlog, в работе, выполнено. Разные категории
      исполнителей требуют разных наборов групп.
      Проверка показала: сокращение набора уже решается скрытием (0006). Остаточная
      боль валидирована конкретным примером — автор хочет переименовать группу «Фокус»
      в «Долгострой» (длинные задачи на несколько дней, стратегические инициативы).
      Это не косметика: меняется семантика группы, а исходное название и подсказка
