# Interview journal for feature planning.
# A topic checklist + free-form notes, updated after each Q&A batch. Serves as the resume
# point for interrupted interviews — not a scorecard.

meta:
  feature_name: "follow-up-tasks"
  feature_base: "docs/features/0012-feat-follow-up-tasks/0012-feat-follow-up-tasks"
  work_type: "feature"
  size: "M"
  status: "in_progress" # in_progress | completed
  started: "2026-09-11"
  last_updated: "2026-09-11"

topics:
  # Cycle 1 — overview
  feature_description:  {required: true,  notes: "У задачи есть список пост-задач (текстовые пункты). Маркер «↪ N» на карточке; блок «После выполнения» в форме; при попадании задачи в «Завершённые» незаведённые пункты автоматически становятся задачами в бэклоге + уведомление; кнопка «→ в бэклог» для досрочного заведения."}
  user_problem:         {required: true,  notes: "Сейчас пост-задачу либо заводят отдельной карточкой заранее (шум на доске), либо пишут в «Зачем» — и после закрытия основной задачи о ней забывают: завершённые свёрнуты и через 30 дней удаляются автоочисткой. Пример: «Выпустить релиз» → «Провести ретро»."}
  target_users:         {required: false, notes: "Проектный менеджер — автор плагина, единственный подтверждённый пользователь."}
  success_criteria:     {required: true,  notes: "Ни одна пост-задача не теряется при закрытии основной: она либо уже заведена, либо заводится автоматически. Маркер виден на доске до заведения. Отмена ☑ полностью откатывает автозаведение. См. AC-1..AC-12 в спеке."}
  constraints:          {required: true,  notes: "Хранение внутри Task в data.json (не отдельными записями — удалит cleanupOrphanedTasks). Миграция v8→v9 + санитизация на каждой загрузке (ADR 0011). Obsidian Notice отсутствует в тестовом моке — добавить. CSS tm-/BEM в styles.css. i18n без интерполяции/плюралов → формат «Заведено задач в «X»: N»."}
  testing_strategy:     {required: true,  notes: "Unit: логика автозаведения, undo, повторное завершение, completed→completed, миграция v9, санитизация. E2E Playwright: форма, маркер в двух режимах, ☑+undo, drag, Notice, скрытый/переименованный бэклог, загрузка v8/битых данных. Интеграционных нет — нет внешних сервисов. Ручная проверка пользователем: темы, мультиколонки, живой Notice."}
  # Cycle 2 — UX and integration
  user_stories:         {required: true,  notes: "5 историй: записать пост-задачи; видеть маркер; автозаведение при закрытии; досрочное заведение; отмена случайного завершения. Сценарии 1–5 в спеке (добавление, автозаведение ☑/drag, отмена, досрочное заведение, Escape после пометки)."}
  acceptance_criteria:  {required: true,  notes: "AC-1..AC-12 в спеке: форма и сохранение/Escape; лимиты 200 симв./20 пунктов; маркер в 2 режимах и tooltip; ☑; drag и перестановка внутри completed; статус в форме не триггерит; undo; нет дублей; «→ в бэклог» по Save; скрытый/переименованный бэклог; миграция/битые данные; i18n."}
  edge_cases:           {required: true,  notes: "Undo ☑ удаляет только задачи этого завершения; drag без undo; повторное завершение без дублей; удаление родителя — пункты пропадают (есть undo удаления); бэклог скрыт/переименован; «Зачем» обрезается до 10000; «→ в бэклог» в форме создания; помеченный, но стёртый пункт отбрасывается; completed→completed не триггер; статус «Завершена» в форме не триггер, но последующий drag в completed — триггер. Создать задачу прямо в «Завершённых» нельзя (у группы нет «+») — кейс снят."}
  error_scenarios:      {required: true,  notes: "Повреждённый список в data.json → санитизация на загрузке (не-массив → [], мусорные элементы отброшены, обрезка до 20/200), плагин запускается. Сбоев сети нет — всё локально."}
  verification_strategy: {required: true, notes: "Агент: tsc, build, unit, e2e по шагам AC, test:all. Пользователь: светлая/тёмная темы, компакт/мультиколонки, живое уведомление Obsidian."}
  ui_ux_requirements:   {required: true,  notes: "Блок «После выполнения» между «Зачем» и «Кто/Когда»: строки [поле 200][→ в бэклог (toggle)][✕], заведённые — серые «✓ заведено», без редактирования, ✕ доступен; «+ Добавить пункт», Enter добавляет следующий; лимит 20. Маркер: обычный — «↪ N» слева от дедлайна (без дедлайна — на его месте справа), компактный — «↪N» перед дедлайном; tooltip со списком незаведённых; не кликабелен. Уведомление Obsidian Notice «Заведено задач в «<бэклог>»: N» (+ «(группа скрыта)»). Бэклог не разворачивается."}
  risks:                {required: true,  notes: "Место в компакт/мультиколонках; корректность undo; completed→completed; утечка правок через живой объект в форме; мусор в бэклоге от автозаведения (принято сознательно)."}
  technical_decisions:  {required: false, notes: "Хранение: массив пунктов внутри Task (не отдельные записи в tasks — их удалит cleanupOrphanedTasks). Отвергнуто: флаг без содержания (не говорит что делать); заметка в «Зачем» (маркер не может погаснуть); связи по ID между карточками (избыточно, решение пользователя). Закрытие: автозаведение незаведённых пунктов в бэклог + уведомление; отвергнуты «только маркер» (завершённые свёрнуты и чистятся через 30 дней — забудется), «уведомление-напоминание» (легко проигнорировать), «окно с галочками» (лишний шаг). Кнопка «Завести»: отложенное создание по Save (выбран вариант Б) вместо немедленного — один момент сохранения, Escape отменяет всё. Триггер: только попадание в completed (☑/drag), не статус в форме — не менять поведение формы."}
  integration_points:   {required: true,  notes: "TaskFormContent/TaskModal (форма), TaskCard (маркер), dataStore quickCompleteTask/undoQuickComplete/moveTask/updateTask/addTask, BoardLayout (toast complete + undo), useSortable (drag идёт в стор напрямую), statusTransitions, migration.ts (v9 + per-load sanitize), cleanup.ts (без изменений), i18n en/ru, obsidian-mock (Notice), 0011 resolveGroupTitle, 0006 hiddenGroups."}
  dependencies:         {required: false, notes: "0003 quick-complete (toast/undo), 0006 видимость групп, 0011 названия групп, 0002/0008 режимы карточек."}
  data_requirements:    {required: false, notes: "Task получает список пунктов {текст, признак «заведено»}; для undo нужна привязка к задачам, созданным конкретным завершением — детали в tech-spec."}
  migration_needs:      {required: false, notes: "v8→v9: всем задачам пустой список. Существующий тест 'v7 → v8: tasks are untouched' и проверки version=8 изменятся by design."}

qa_log:
  - batch: 1
    asked: "форма хранения; кнопка «Завести задачу»; поведение при закрытии; маркер"
    decided: "список текстовых пунктов внутри задачи (связи по ID — избыточно); кнопка «Завести» у пункта → задача в бэклог; при завершении родителя незаведённые пункты автоматически заводятся в бэклог + уведомление «заведено N задач в бэклог»; маркер «↪ N» (незаведённые) рядом с дедлайном в обоих режимах, tooltip со списком"
  - batch: 2
    asked: "что считается завершением; undo и повторы; когда кнопка «Завести» реально создаёт задачу; поля создаваемой задачи"
    decided: "триггер — попадание в группу «Завершённые» (☑ или drag; completed→completed не считается); статус «Завершена» в форме НЕ триггерит; undo ☑ удаляет автозаведённые задачи и возвращает пункты в «не заведено»; заведённый пункт помечается «✓ заведено», остаётся в списке как история, повторно не создаётся, в маркере не считается; кнопка «Завести» в форме помечает пункт, создание — по «Сохранить» (Esc отменяет всё); новая задача: what=текст пункта, why=«После: <what родителя>», who/deadline пусто, приоритет по умолчанию из настроек, статус new, конец бэклога той же доски; бэклог скрыт — всё равно создаём, уведомление это сообщает; уведомление — Obsidian Notice «Заведено N задач в бэклог»"
  - batch: 3
    asked: "UI блока в форме; маркер; граничные случаи (удаление, статус в форме, миграция); размер и тесты"
    decided: "всё принято как предложено: блок «После выполнения» (200 симв., 20 пунктов, Enter, toggle «→ в бэклог», «✓ заведено»); маркер некликабельный, tooltip; удаление родителя без предупреждения; миграция — пустой список; размер M; unit + e2e + ручная проверка тем"

notes: |
  Исходная формулировка пользователя: минимум — маркер на карточке (рядом с дедлайном), что у задачи
  есть пост-зависимости; возможно — отдельное поле в форме со списком пост-задач.
  Кейс «задача создаётся сразу в Завершённых с пунктами» снят: у группы «Завершённые» нет кнопки «+»
  (BoardLayout.svelte:291, onAdd={null}).
  i18n не поддерживает интерполяцию и плюралы — текст уведомления в формате «...: N».
