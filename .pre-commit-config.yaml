# pre-commit builds gitleaks from source on first run; 3.0.0 is the first version
# that bootstraps the Go toolchain itself.
minimum_pre_commit_version: '3.0.0'

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Runs on commit: staged changes only.
      - id: gitleaks

      # Manual: whole git history. Not run on commit.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in git history
        entry: gitleaks git --redact --verbose
        stages: [manual]
